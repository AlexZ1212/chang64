# Exercice du jour sur Bluesky (2026-11-07), tous les jours depuis le 14/11 : src/bluesky_jour.js
# lit l'exercice du jour sur le site en ligne et le publie avec l'image du
# plateau. Secrets du depot a creer : BLUESKY_IDENTIFIANT (ex.
# chang64.bsky.social) et BLUESKY_MOT_DE_PASSE (mot de passe d'APPLICATION
# Bluesky). Sans eux, la tache ne publie rien et reste verte.
name: Exercice du jour sur Bluesky

on:
  schedule:
    # Tous les jours depuis le 2026-11-14, a la demande d'Alexandre (trois
    # fois par semaine avant), a 14 h UTC : 15 h a Paris l'hiver, 9 h a New
    # York, dans le creneau de journee ou les etudes des outils de
    # planification placent l'activite sur Bluesky (13 h - 20 h UTC environ).
    # GitHub lance les taches programmees avec retard (prevues a 15 h UTC,
    # elles sont parties entre 19 h 14 et 23 h 38, et celle du lundi 9 a
    # publie l'exercice du mardi). La tache part donc a 8 h 17 et le script
    # attend 14 h (--heure) ; un second depart a 12 h 47 rattrape un
    # lancement saute, et le script ne publie jamais deux fois le meme
    # exercice. Minutes 17 et 47 : GitHub conseille d'eviter le debut de
    # l'heure, le plus charge. Depot public : l'attente ne coute rien.
    - cron: "17 8 * * *"
    - cron: "47 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bluesky-jour
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    # Jusqu'a 5 h 43 d'attente (8 h 17 -> 14 h), limite GitHub : 6 h.
    timeout-minutes: 355
    steps:
      # Seuls les trois fichiers utiles : le depot entier (banque comprise)
      # pese plus de 200 Mo.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src/bluesky_jour.js
            src/plateau_svg.js
            src/ds/pieces.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer sharp (rendu de l'image)
        working-directory: src
        run: npm install sharp@0.35.4 --no-save --no-audit --no-fund --no-package-lock
      - name: Publier
        working-directory: src
        env:
          BLUESKY_IDENTIFIANT: ${{ secrets.BLUESKY_IDENTIFIANT }}
          BLUESKY_MOT_DE_PASSE: ${{ secrets.BLUESKY_MOT_DE_PASSE }}
        # Lance a la main (Run workflow), il publie tout de suite.
        run: node bluesky_jour.js ${{ github.event_name == 'schedule' && '--heure 14:00' || '' }}
