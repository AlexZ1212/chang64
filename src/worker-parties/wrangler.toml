# chang64 - Worker des parties en direct (2026-11-19)
#
# Projet Cloudflare a part du projet Pages (un projet Pages ne peut pas
# definir de Durable Object). Aucune adresse workers.dev ni adresse d'apercu :
# il n'est servi que sous chang64.com, par la route ci-dessous, qui passe
# devant le projet Pages pour ce seul chemin.
name = "chang64-parties"
main = "index.js"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false

routes = [
  { pattern = "chang64.com/api/partie/*", zone_name = "chang64.com" }
]

# Une fois par heure : les parties par correspondance d'un compte supprime
# n'en gardent plus rien, et une echeance manquee est rattrapee (balayer(),
# index.js). Une lecture de la base par passage.
[triggers]
crons = ["17 * * * *"]

# Un objet par partie, stockage SQLite (le seul permis en offre gratuite).
[[durable_objects.bindings]]
name = "PARTIES"
class_name = "Partie"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Partie"]

# La base du site : sessions (jetons), pseudos (comptes), blocages, lus seulement ;
# ce Worker n'ecrit que la table invitations et, a la fin d'une partie, les
# trois compteurs direct_v, direct_n, direct_d des deux joueurs, ainsi que leur
# Elo entre membres (colonnes elo et elo_n, 2026-11-21).
[[d1_databases]]
binding = "DB"
database_name = "chang64-difficulte"
database_id = "b8194b59-e463-4902-9355-dac0ebf83755"
